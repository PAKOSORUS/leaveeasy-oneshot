<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/login.js"></script>
</head>
<body>
  <div class="navbar"><span class="brand">🔧 LeaveEasy</span></div>

  <div class="container">
    <h1>เข้าสู่ระบบ</h1>
    <p class="subtitle">ล็อกอินก่อนใช้งานระบบขอลาออนไลน์</p>

    <div class="card">
      <div id="ข้อความเตือน" class="alert alert-error hidden"></div>
      <form id="ฟอร์มล็อกอิน">
        <label for="email">อีเมล</label>
        <input type="email" id="email" autocomplete="username">

        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" autocomplete="current-password">

        <div class="btn-row">
          <button type="submit" id="ปุ่มเข้าสู่ระบบ">เข้าสู่ระบบ</button>
          <a class="btn btn-ghost" href="signup.html">สมัครสมาชิก</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
