<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/signup.js"></script>
</head>
<body>
  <div class="navbar"><span class="brand">🔧 LeaveEasy</span></div>

  <div class="container">
    <h1>สมัครสมาชิก</h1>
    <p class="subtitle">ผู้สมัครใหม่ทุกคนจะมีบทบาทเริ่มต้นเป็นผู้ขอลา</p>

    <div class="card">
      <div id="ข้อความเตือน" class="alert alert-error hidden"></div>
      <form id="ฟอร์มสมัคร">
        <label for="name">ชื่อ-นามสกุล</label>
        <input type="text" id="name" autocomplete="name">

        <label for="email">อีเมล</label>
        <input type="email" id="email" autocomplete="username">

        <label for="password">รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label>
        <input type="password" id="password" autocomplete="new-password">

        <div class="btn-row">
          <button type="submit" id="ปุ่มสมัคร">สมัครสมาชิก</button>
          <a class="btn btn-ghost" href="login.html">มีบัญชีแล้ว เข้าสู่ระบบ</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
